<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="synthoraGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="18" y1="12" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Plate -->
  <rect width="48" height="48" rx="12" fill="#08090D"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="url(#synthoraGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Outer Glow Hexagon / Node Ring -->
  <path d="M24 8L38 16V32L24 40L10 32V16L24 8Z" stroke="url(#synthoraGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)" opacity="0.85"/>
  
  <!-- Central Spark / Synthesis Core -->
  <path d="M24 14L26.5 21.5L34 24L26.5 26.5L24 34L21.5 26.5L14 24L21.5 21.5L24 14Z" fill="url(#sparkGrad)"/>
  
  <!-- Corner Tech Accent Dots -->
  <circle cx="10" cy="16" r="1.5" fill="#06B6D4"/>
  <circle cx="38" cy="16" r="1.5" fill="#8B5CF6"/>
  <circle cx="24" cy="40" r="1.5" fill="#6366F1"/>
</svg>
